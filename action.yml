name: 'NotTodayThankyou'
description: 'Automatically closes PRs that fail selected tests and checks'

inputs:
  github-token:
    description: 'GitHub token used for API requests'
    required: false
    default: ${{ github.token }}

  close-message:
    description: 'Custom message to post on the PR when automatically closing it for missing fork CI'
    required: false
    default: '❌ **PR Automatically Closed**: Workflows have not been executed on your fork. Please enable GitHub Actions on your fork, run your test suite, and reopen this PR.'

  post-comment:
    description: 'Whether to post an explanatory comment on the PR before closing it'
    required: false
    default: 'true'

  allowed-authors:
    description: 'Comma-separated list of GitHub usernames that bypass all checks'
    required: false
    default: ''

  max-prs-per-day:
    description: 'Maximum PRs created by author across GitHub in the last 24 hours before closing (-1 to disable)'
    required: false
    default: '-1'

  require-associated-issue:
    description: 'Close PR if no linked issue is found via GitHub closing references or timeline cross-references'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
