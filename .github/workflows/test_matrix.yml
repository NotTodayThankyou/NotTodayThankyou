name: Tests for NotTodayThankyou

on:
  push:
  workflow_dispatch:
    
jobs:
  user_authorization_check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure user instigating the workflow owns the org that owns the repo.
        uses: actions/github-script@v9
        with:
          # Organization permissions: Read access to members 
          github-token: ${{ secrets.READ_ORG_MEMBERS_PAT }}
          script: |
            const org = context.repo.owner;
            const username = context.actor;

            try {
            const { data: membership } = await github.rest.orgs.getMembershipForUser({
              org: org,
              username: username
            });

            if (membership.role === 'admin' && membership.state === 'active') {
              console.log(`✅ User ${username} is an active Owner (admin) of ${org}.`);
            } else {
              core.setFailed(`❌ User ${username} is not an owner of ${org}. Role: ${membership.role}`);
            }
            } catch (err) {
              core.setFailed(`Failed to verify org membership for ${username}: ${err.message}`);
            }

  test:
    needs: user_authorization_check
    strategy:
      max-parallel: 1
      matrix:
        params: 
          - name: Test PRs not closed whose author is on allowlist
            action-inputs: {
              allowed-authors: 'JamesParrott-machine-account',
              max-prs-per-day: "0",
              require-associated-issue: "true",
            }
            enable-fork-actions: false
            expected-pr-open: true
            expected-comment-added: false
            cleanup-fork: true

          - name: Test PR that didn't run workflows gets closed with a comment
            action-inputs: {}
            enable-fork-actions: false
            expected-pr-open: false
            expected-comment-added: true
            cleanup-fork: true


          - name: Test PR that didn't run workflows gets closed without a comment
            action-inputs: {
              post-comment: 'false',
            }
            enable-fork-actions: false
            expected-pr-open: false
            expected-comment-added: false
            cleanup-fork: true


          - name: Test PR that did run workflows remains open
            action-inputs: {}
            enable-fork-actions: true
            expected-pr-open: true
            expected-comment-added: false
            cleanup-fork: true


          - name: Test PR closed if max number of PRs set, and exceeded
            action-inputs: {
              max-prs-per-day: "0",
            }
            enable-fork-actions: true
            expected-pr-open: false
            expected-comment-added: true
            cleanup-fork: true

          - name: Test PR left open if max number of PRs set, but not exceeded
            action-inputs: {
              max-prs-per-day: "86400", # Number of seconds in 24 hours
            }
            enable-fork-actions: true
            expected-pr-open: true
            expected-comment-added: false
            cleanup-fork: true

          - name: Test PR closed if it has no associated issue
            action-inputs: {
              require-associated-issue: "true",
            }
            enable-fork-actions: true
            expected-pr-open: false
            expected-comment-added: true
            cleanup-fork: true

          - name: Test PR left open if it claims to close an issue
            action-inputs: {
              require-associated-issue: "true",
            }
            pr-body-content: "Closes: #5 \n"
            enable-fork-actions: true
            expected-pr-open: true
            expected-comment-added: false
            cleanup-fork: true

          - name: Test PR left open if it mentions an issue
            action-inputs: {
              require-associated-issue: "true",
            }
            pr-body-content: "Completely unrelated to: #5 \n"
            enable-fork-actions: true
            expected-pr-open: true
            expected-comment-added: false
            cleanup-fork: true




    name: ${{ matrix.settings.name }}
    uses: ./.github/workflows/parametrisable_test.yml
    with:
      target-owner: 'NotTodayThankyou'
      target-repo: '__dummy_test_repo'
      action-inputs: ${{ toJson(matrix.params.action-inputs) }}
      enable-fork-actions: ${{ matrix.params.enable-fork-actions }}
      expected-pr-open: ${{ matrix.params.expected-pr-open }}
      expected-comment-added: ${{ matrix.params.expected-comment-added }}
      cleanup-fork: ${{ matrix.params.cleanup-fork }}
    secrets: inherit

  test_PR_from_contributor:
    needs: user_authorization_check
    name: Test PR left open if author is already a contributor
    uses: ./.github/workflows/parametrisable_test.yml
    with:
      target-owner: 'NotTodayThankyou'
      target-repo: '__dummy_repo_for_machine_account_to_be_contributor_of'
      action-inputs: "{}"
      enable-fork-actions: false
      expected-pr-open: true
      expected-comment-added: false
      cleanup-fork: true
    secrets: inherit